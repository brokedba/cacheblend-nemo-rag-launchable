# GPU time-slicing config for the NeMo NIMs.
#
# WHY: NeMo's 4 core NIMs each request `nvidia.com/gpu: 1`, but the two engine arms already
# hold 2 of the 4 physical GPUs — so without slicing the NIMs cannot all schedule. Slicing
# makes each physical GPU advertise several schedulable units (the NIMs are ~4.8 GiB total).
#
# NOTE: no `namespace:` here on purpose — deploy/03-nemo.sh discovers the GPU Operator's
# namespace at runtime (it is NOT always `gpu-operator`; Brev's microk8s image uses
# `gpu-operator-resources`) and applies this with `-n "$GPU_NS"`.
#
# ISOLATION CAVEAT: the device-plugin config is per-NODE, so on a single-node cluster this
# slices ALL GPUs — placement of the engine pods is then not pinned to a whole card. Fine for
# a functional bring-up; for the rigorous baseline-vs-CacheBlend benchmark, scale the NeMo
# NIMs down first so the engines are the only GPU consumers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: time-slicing-config
data:
  any: |-
    version: v1
    flags:
      migStrategy: none
    sharing:
      timeSlicing:
        resources:
        - name: nvidia.com/gpu
          replicas: 4        # units per physical GPU — 4 is enough for the 4 core NIMs
