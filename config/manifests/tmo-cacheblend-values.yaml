# TMO Helm chart values — CacheBlend ON, engine+coordinator OFF (single blend server per node).
# Chart: oci://artifacts.tensormesh.ai/tensormesh-production/charts/tensormesh-operator
#        (version pinned in deploy/02-engines.sh)
#
# MATCHED VERSION TUPLE — keep in lockstep (mixing versions is unsupported):
#   Helm chart  0.5.3   (CHART_VERSION in deploy/02-engines.sh)
#   Operator    v0.5.3
#   Cache engine v0.5.3 (CacheBlendEngine spec.image)
#   Plugin      v0.5.3  (private, via the artifact proxy)
#   vLLM serving lmcache/vllm-openai:v0.5.3 (config/manifests/engine-*.yaml)
crds:
  enabled: true
fullnameOverride: tensormesh-operator

webhook:
  enabled: true            # CacheBlend REQUIRES the mutating webhook (needs cert-manager)

tests:
  enabled: false

# Offload engine + coordinator OFF — the CacheBlendEngine does both offload and blend on one node.
engine:      { enabled: false }
coordinator: { enabled: false }

operator:
  image:
    repository: lmcache/lmcache-operator      # public (docker.io) — no auth
    tag: v0.5.3
    pullPolicy: IfNotPresent

cacheBlend:
  enabled: true
  name: tensormesh-cacheblend
  namespace: cacheblend-workload
  spec:
    privileged: true
    l1: { sizeGB: 40 }               # blend server L1 = HOST RAM (keep ≥ 1.25× working set to avoid eviction)
    server:
      chunkSize: 256                 # FIXED at 256 (block_size 64 × 4)
    image:
      repository: lmcache/vllm-openai         # public (docker.io) — no auth
      tag: v0.5.3
      pullPolicy: IfNotPresent
    blend:
      checkLayer: 2                  # validated at 2; gpt-oss model card suggests 1 — revisit if tuning
      recompRatio: 0.15
    injection:
      payloadImage:
        # PRIVATE — served by the Tensormesh artifact proxy, pulled with the
        # cacheblend-plugin-pull secret (x-access-token + TENSORMESH_API_KEY).
        repository: artifacts.tensormesh.ai/tensormesh-production/images/cacheblend-plugin
        tag: v0.5.3
        pullPolicy: IfNotPresent
      imagePullSecrets:
        - name: cacheblend-plugin-pull
      cudagraph: eager               # == --enforce-eager, injected into the vLLM args
